<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7B6DB2">
  <meta name="description" content="اكتب رسالتك وشوفها على شاشة هولو — اليوم الوطني ٩٦">
  <title>Hollow × غضى — شارك رسالتك</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23006C35'/%3E%3Cpath d='M10 8h3v6.5h6V8h3v16h-3v-6.5h-6V24h-3z' fill='%23D9B26A'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/form.css">
</head>

<body class="page-form">
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__band"></div>
  </div>

  <div id="offlineBar" class="offline-bar" role="status" hidden>
    لا يوجد اتصال بالإنترنت
  </div>

  <main class="shell">

    <header class="brand">
      <h1 class="brand__name" dir="ltr">Hollow <span class="collab__x">×</span> <span class="collab__ar">غضى</span></h1>
      <p class="brand__slogan" aria-label="عزّنا بجودنا">عِـــزّنـــا بجودنـــا</p>
      <p class="brand__tag">اليوم الوطني <span class="brand__num">٩٦</span></p>
    </header>

    <form id="form" class="panel" novalidate autocomplete="off">

      <div class="field">
        <div class="field__head">
          <label class="field__label" for="text">رسالتك</label>
          <span class="counter" id="counter" aria-hidden="true">
            <b id="count">٠</b><span class="counter__sep">/</span>١٥٠
          </span>
        </div>
        <textarea
          id="text"
          name="text"
          class="input input--area"
          rows="4"
          maxlength="150"
          required
          enterkeyhint="done"
          placeholder="كل عام وأنتم بخير…"></textarea>
      </div>

      <div class="field">
        <label class="field__label" for="name">اسمك</label>
        <input
          id="name"
          name="name"
          class="input"
          type="text"
          maxlength="20"
          autocomplete="name"
          enterkeyhint="send"
          placeholder="اكتب اسمك">
      </div>

      <label class="toggle">
        <input id="anon" type="checkbox" class="toggle__input">
        <span class="toggle__ui" aria-hidden="true"></span>
        <span class="toggle__label">أخفِ اسمي</span>
      </label>

      <p id="error" class="alert" role="alert" hidden></p>

      <div class="actions">
        <button id="submit" class="btn btn--primary" type="submit">
          <span id="submitLabel">أرسل رسالتك</span>
        </button>
        <button id="retry" class="btn btn--ghost" type="button" hidden>
          إعادة المحاولة
        </button>
      </div>

    </form>

    <section id="success" class="panel panel--success" hidden>
      <div class="success__mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor"
             stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 24.5 L21 32 L35 17" />
        </svg>
      </div>
      <h2 class="success__title">وصلت رسالتك 🇸🇦</h2>
      <p class="success__sub">شوفها على الشاشة</p>
      <button id="again" class="btn btn--primary" type="button" disabled>
        <span id="againLabel">أرسل رسالة ثانية</span>
      </button>
    </section>

  </main>

  <noscript>
    <p style="padding:1rem;text-align:center">
      فعّل الجافاسكربت في متصفحك لإرسال رسالتك.
    </p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
