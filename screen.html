  <div class="stage">

    <header class="head">
      <span class="logo" dir="ltr">Hollow <span class="collab__x">×</span> <span class="collab__ar">غضى</span></span>
      <p class="occasion">
        <span class="occasion__label">اليوم الوطني</span>
        <span class="occasion__num">٩٦</span>
      </p>
    </header>

    <main class="wall" id="wall">
      <div class="wall__slots" aria-hidden="true">
        <i class="slot"></i><i class="slot"></i>
        <i class="slot"></i><i class="slot"></i>
        <i class="slot"></i><i class="slot"></i>
        <i class="slot"></i><i class="slot"></i>
        <i class="slot"></i><i class="slot"></i>
        <i class="slot"></i><i class="slot"></i>
      </div>

      <div class="wall__ghosts" id="ghosts" aria-hidden="true"></div>
      <div class="wall__grid" id="grid"></div>

      <div class="wall__empty" id="empty" hidden>
        <p class="empty__title">الجدار ينتظر أول رسالة</p>
        <p class="empty__sub">امسح الرمز واكتب كلمتك للوطن</p>
      </div>
    </main>

    <aside class="panel">
      <div class="qr-card">
        <div class="qr" id="qr" aria-label="رمز QR لصفحة المشاركة"></div>
        <p class="qr-card__cta">امسح وشارك رسالتك</p>
      </div>

      <p class="slogan" aria-label="عزّنا بجودنا">
        <span>عِـــزّنـــا</span>
        <span>بجودنـــا</span>
      </p>
    </aside>

  </div>

  <div class="conn-badge" id="badge" role="status" hidden>
    <span class="conn-badge__dot" aria-hidden="true"></span>
    إعادة الاتصال…
  </div>
